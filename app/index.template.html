<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--CSP-->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workbench</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- Generated by scripts/build.mjs with mport: the import map first, then the modulepreloads -->
  <!--IMPORTMAP-->
  <!--PRELOAD-->
  <link rel="stylesheet" href="styles/generated/wa.css">
  <link rel="stylesheet" href="styles/app.css">
  <script type="module" src="app/main.js"></script>
</head>
<body>
  <!-- html-modules: bare specifiers go through the import map (@workbench/ui/ -> /components/) -->
  <html-import src="@workbench/ui/kit.html" as="kit"></html-import>
  <html-import src="@workbench/ui/kit.html"><html-binding export="tokens" adopt></html-binding></html-import>
  <html-import src="@workbench/ui/notes.html" as="wb"></html-import>
  <html-import src="@workbench/ui/tasks.html" as="wb"></html-import>
  <html-import src="@workbench/ui/data.html" as="wb"></html-import>
  <html-import src="@workbench/ui/settings.html" as="wb"></html-import>
  <html-import src="@workbench/ui/clips.html" as="wb"></html-import>

  <a class="skip-link" href="#stage">Skip to the workbench</a>
  <header class="topbar">
    <h1 id="app-title">Workbench</h1>
    <nav class="actions" aria-label="Workbench actions">
      <kit--button data-open="notes">Notes</kit--button>
      <kit--button data-open="tasks">Tasks</kit--button>
      <kit--button data-open="data">Data</kit--button>
      <kit--button data-open="clips">Clips</kit--button>
      <kit--button data-open="settings">Settings</kit--button>
      <span class="sep" aria-hidden="true"></span>
      <kit--button data-layout="master-stack" pressed="false">Master</kit--button>
      <kit--button data-layout="grid" pressed="false">Grid</kit--button>
      <span class="sep" aria-hidden="true"></span>
      <kit--button id="palette-open" variant="primary" label="Open command palette">Commands</kit--button>
    </nav>
  </header>
  <main id="main">
    <wa-stage id="stage" aria-label="Workbench windows"></wa-stage>
  </main>
  <footer class="statusbar">
    <span id="status" role="status">Starting…</span>
    <span id="sanitizer" data-engine="">Sanitizer: loading…</span>
    <span id="sync" data-peers="0">Tabs: 1</span>
  </footer>
  <noscript>The workbench needs JavaScript and ES modules.</noscript>
</body>
</html>
