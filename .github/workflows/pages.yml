name: Pages

# The app is retired: Pages serves only the redirect page in redirect/ (to https://opensource.johnhenry.me/orrery/#/workbench).
# Pages is set to "GitHub Actions" as its source (Settings > Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Retired 2026-10-03: the site is now only a redirect to the orrery planet. redirect/index.html covers the root and
      # redirect/404.html every deep path (GitHub Pages serves 404.html for any missing file).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
